name: MPS grid_sample probe (fork only — not for upstream)

on:
  workflow_dispatch:
  push:
    branches: [probe/mps-grid-sample]

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        torch-version: ["2.9.1", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install torch ${{ matrix.torch-version }} and kornia
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.torch-version }}" = "latest" ]; then
            python -m pip install torch
          else
            python -m pip install torch==${{ matrix.torch-version }}
          fi
          python -m pip install -e .
      - name: MPS availability
        run: python -c "import torch; print('torch', torch.__version__, '| mps available:', torch.backends.mps.is_available())"
      - name: Run grid_sample probe matrix
        run: python probe_mps_grid_sample.py
      - name: Run kornia issue 4032 repro
        run: python probe_kornia_4032.py
